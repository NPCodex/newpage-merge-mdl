name: Release

# Manual only. Creates one DRAFT release with one complete ZIP per platform.
on:
  workflow_dispatch:
    inputs:
      replace_tag:
        description: Existing release tag to replace after both platform packages pass
        type: string
        required: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      version: ${{ steps.rel.outputs.version }}
      replace: ${{ steps.rel.outputs.replace }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Choose release revision tag
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^project(NewPageMergeMDL VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          replace='${{ inputs.replace_tag }}'
          if [ -n "$replace" ]; then
            python3 - "$replace" "$version" <<'PY'
          import json, re, subprocess, sys
          tag, version = sys.argv[1:]
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit('replace_tag must be an existing stable vX.Y.Z tag')
          completed = subprocess.run(['gh', 'release', 'view', tag, '--repo', __import__('os').environ['GITHUB_REPOSITORY'],
                                      '--json', 'tagName,isDraft,isPrerelease'], text=True, capture_output=True)
          if completed.returncode:
              raise SystemExit('requested replacement release must already exist')
          release = json.loads(completed.stdout)
          if release['tagName'] != tag or release['isDraft'] or release['isPrerelease']:
              raise SystemExit('replacement target must be an existing published stable release')
          if tag[1:] != version:
              raise SystemExit('replacement release version must match CMake project version')
          PY
            echo "tag=$replace" >> "$GITHUB_OUTPUT"
            echo "replace=true" >> "$GITHUB_OUTPUT"
          else
            tag=$(git tag --list "v$version-r*" --sort=-v:refname | head -n 1)
            [ -n "$tag" ] && revision=$((${tag##*-r} + 1)) || revision=1
            echo "tag=v$version-r$revision" >> "$GITHUB_OUTPUT"
            echo "replace=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            plat: win64
            ext: .exe
          - os: ubuntu-latest
            plat: linux64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Test packaging and update detection
        run: python -m unittest discover -s tests -p test_automation.py -v

      - name: Configure
        # no -G: use whatever toolchain the runner image ships
        run: cmake -B build -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DPULSE_BUILD_MESHTOOL=ON -DPULSE_BUILD_L4D_ANIMSWAP=ON -DPULSE_BUILD_VMD2VALVEBIPED=ON -DPULSE_BUILD_AG2PROPORTIONS=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_MINSIZEREL="${{ github.workspace }}/dist" -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${{ github.workspace }}/dist"

      - name: Build
        run: cmake --build build --config MinSizeRel --parallel 2

      - name: Run standalone subtool regressions
        shell: bash
        run: |
          python tests/vmd2valvebiped_input_test.py --bin-dir dist/subtools
          python tests/l4d_retarget_names_test.py dist/NewPageMergeMDL${{ matrix.ext }} dist/subtools/l4d_animswap${{ matrix.ext }}
          python tests/subtools_cli_arguments_test.py --bin-dir dist

      - name: Test pinned helper staging
        run: python -m unittest discover -s tests -p test_windows_extras.py -v

      - name: Stage verified Windows C4D helper
        if: matrix.plat == 'win64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/fetch_windows_extras.py --dist dist

      - name: Configure isolated output recovery tests
        run: cmake -S tests/output_transactions -B output-tests -DCMAKE_BUILD_TYPE=Release

      - name: Build isolated output recovery tests
        run: cmake --build output-tests --config Release --parallel 2

      - name: Test killed processes and output rollback
        run: ctest --test-dir output-tests -C Release --output-on-failure

      - name: Configure meshtool response tests
        run: cmake -S tests/meshtool_response -B meshtool-response-tests -DCMAKE_BUILD_TYPE=Release

      - name: Build meshtool response tests
        run: cmake --build meshtool-response-tests --config Release --parallel 2

      - name: Test meshtool response publication
        run: ctest --test-dir meshtool-response-tests -C Release --output-on-failure

      - name: Package with maintained source provenance
        shell: bash
        run: |
          python -c 'import json; json.dump({"project_version":"${{ needs.prepare.outputs.version }}","controller_sha":"${{ github.sha }}","release_tag":"${{ needs.prepare.outputs.tag }}","source_kind":"maintained checkout","build":"MinSizeRel with interprocedural optimization"},open("upstream-manifest.json","w"))'
          python .github/scripts/upstream_release.py package --source . --dist dist --platform ${{ matrix.plat }} --manifest upstream-manifest.json --output newpage-merge-mdl-${{ needs.prepare.outputs.tag }}-${{ matrix.plat }}.zip

      - name: Verify actual packaged binaries
        id: verify
        shell: bash
        run: |
          probe=$(find output-tests -type f -name 'subtool_transaction_probe${{ matrix.ext }}' -print -quit)
          test -n "$probe"
          python tests/verify_package.py newpage-merge-mdl-${{ needs.prepare.outputs.tag }}-${{ matrix.plat }}.zip --manifest upstream-manifest.json --subtool-probe "$probe"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.plat }}
          path: newpage-merge-mdl-*.zip
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true

      - name: Build notes
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          [ -n "$prev" ] && range="$prev..HEAD" || range="HEAD"
          git log --reverse --pretty=format:%x00%B "$range" | python3 .github/scripts/release-notes.py > notes.txt
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          notes = Path('notes.txt')
          intro = ('Download one ZIP for your operating system and extract the entire folder. '
                   'Windows includes the C4D and VRML converters; Linux includes the tools supported on Linux. '
                   'Read INSTALL.md inside the package and always set -game to the directory containing '
                   'the correct target gameinfo.txt before compiling. No separate update or helper package is needed.\n\n'
                   '下载对应系统的一个 ZIP，完整解压即可使用；编译前务必设置正确的 gameinfo.txt 所在目录。'
                   '安装说明、校验清单和验证记录均在包内。\n\n')
          checksums = '\n'.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}'
                                for p in sorted(Path('.').glob('newpage-merge-mdl-*.zip')))
          notes.write_text(intro + notes.read_text(encoding='utf-8') + '\n\nZIP SHA256:\n```text\n'
                           + checksums + '\n```\n', encoding='utf-8')
          PY
          cat notes.txt

      - name: Create draft release
        if: needs.prepare.outputs.replace != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.prepare.outputs.tag }}" newpage-merge-mdl-${{ needs.prepare.outputs.tag }}-win64.zip newpage-merge-mdl-${{ needs.prepare.outputs.tag }}-linux64.zip --target "${{ github.sha }}" --title "${{ needs.prepare.outputs.tag }}" --notes-file notes.txt --draft

      - name: Replace existing stable release assets
        if: needs.prepare.outputs.replace == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          before=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
          test -n "$before"
          cp "newpage-merge-mdl-$tag-win64.zip" newpage-merge-mdl-win64.zip
          cp "newpage-merge-mdl-$tag-linux64.zip" newpage-merge-mdl-linux64.zip
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.txt
          gh release upload "$tag" newpage-merge-mdl-win64.zip newpage-merge-mdl-linux64.zip --clobber
          python3 - <<'PY'
          import hashlib, os, subprocess, json
          tag = os.environ['RELEASE_TAG']
          repository = os.environ['GITHUB_REPOSITORY']
          release = json.loads(subprocess.check_output(
              ['gh', 'release', 'view', tag, '--repo', repository, '--json', 'assets']).decode())
          expected = {
              'newpage-merge-mdl-win64.zip',
              'newpage-merge-mdl-linux64.zip',
          }
          for name in expected:
              local = name
              sha = hashlib.sha256(open(local, 'rb').read()).hexdigest()
              matches = [asset for asset in release['assets'] if asset['name'] == name]
              if len(matches) != 1 or matches[0].get('digest') != 'sha256:' + sha:
                  raise RuntimeError('Replacement asset digest mismatch: ' + name)
          PY
          after=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
          test "$before" = "$after"
