name: Release

# Manual only. Creates one DRAFT release with one complete ZIP per platform.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      version: ${{ steps.rel.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Choose release revision tag
        id: rel
        shell: bash
        run: |
          version=$(sed -n 's/^project(NewPageMergeMDL VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag=$(git tag --list "v$version-r*" --sort=-v:refname | head -n 1)
          [ -n "$tag" ] && revision=$((${tag##*-r} + 1)) || revision=1
          echo "tag=v$version-r$revision" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            plat: win64
            ext: .exe
          - os: ubuntu-latest
            plat: linux64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Test packaging and update detection
        run: python -m unittest discover -s tests -p test_automation.py -v

      - name: Configure
        # no -G: use whatever toolchain the runner image ships
        run: cmake -B build -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DPULSE_BUILD_MESHTOOL=ON -DPULSE_BUILD_L4D_ANIMSWAP=ON -DPULSE_BUILD_VMD2VALVEBIPED=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_MINSIZEREL="${{ github.workspace }}/dist" -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${{ github.workspace }}/dist"

      - name: Build
        run: cmake --build build --config MinSizeRel --parallel 2

      - name: Test pinned helper staging
        run: python -m unittest discover -s tests -p test_windows_extras.py -v

      - name: Stage verified Windows C4D helper
        if: matrix.plat == 'win64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/fetch_windows_extras.py --dist dist

      - name: Test emitted models
        run: python tests/compatibility.py dist/NewPageMergeMDL${{ matrix.ext }}

      - name: Package with maintained source provenance
        shell: bash
        run: |
          python -c 'import json; json.dump({"project_version":"${{ needs.prepare.outputs.version }}","controller_sha":"${{ github.sha }}","release_tag":"${{ needs.prepare.outputs.tag }}","source_kind":"maintained checkout","build":"MinSizeRel with interprocedural optimization"},open("upstream-manifest.json","w"))'
          python .github/scripts/upstream_release.py package --source . --dist dist --platform ${{ matrix.plat }} --manifest upstream-manifest.json --output newpage-merge-mdl-${{ needs.prepare.outputs.tag }}-${{ matrix.plat }}.zip

      - name: Verify actual packaged binaries
        run: python tests/verify_package.py newpage-merge-mdl-${{ needs.prepare.outputs.tag }}-${{ matrix.plat }}.zip --manifest upstream-manifest.json

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.plat }}
          path: newpage-merge-mdl-*.zip
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true

      - name: Build notes
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          [ -n "$prev" ] && range="$prev..HEAD" || range="HEAD"
          git log --reverse --pretty=format:%x00%B "$range" | python3 .github/scripts/release-notes.py > notes.txt
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          notes = Path('notes.txt')
          intro = ('Download one ZIP for your operating system and extract the entire folder. '
                   'Windows includes the C4D and VRML converters; Linux includes the tools supported on Linux. '
                   'Read INSTALL.md inside the package and always set -game to the directory containing '
                   'the correct target gameinfo.txt before compiling. No separate update or helper package is needed.\n\n'
                   '下载对应系统的一个 ZIP，完整解压即可使用；编译前务必设置正确的 gameinfo.txt 所在目录。'
                   '安装说明、校验清单和验证记录均在包内。\n\n')
          checksums = '\n'.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}'
                                for p in sorted(Path('.').glob('newpage-merge-mdl-*.zip')))
          notes.write_text(intro + notes.read_text(encoding='utf-8') + '\n\nZIP SHA256:\n```text\n'
                           + checksums + '\n```\n', encoding='utf-8')
          PY
          cat notes.txt

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.prepare.outputs.tag }}" newpage-merge-mdl-${{ needs.prepare.outputs.tag }}-win64.zip newpage-merge-mdl-${{ needs.prepare.outputs.tag }}-linux64.zip --target "${{ github.sha }}" --title "${{ needs.prepare.outputs.tag }}" --notes-file notes.txt --draft
