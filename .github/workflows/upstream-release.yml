name: Upstream sync and automatic release

on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'README.en.md'
      - 'INSTALL.md'
      - 'RESEARCH.md'
      - 'IMPROVEMENTS.md'
      - 'VALIDATION.md'
      - 'COMPATIBILITY.md'
      - 'AUTOMATION.md'
      - 'automation/**'
      - '.github/scripts/upstream_release.py'
      - '.github/scripts/fetch_windows_extras.py'
      - '.github/scripts/refresh_overlay.py'
      - '.github/scripts/publish_release.py'
      - '.github/workflows/upstream-release.yml'
      - '.github/images/newpage-*.png'
      - 'assets/branding/**'
      - 'tests/**'
      - 'libs/**'
      - 'mdlcompiler/**'
      - 'mdldecompiler/**'
      - 'subtools/**'
      - 'tools/**'
      - 'integration/**'
      - 'FIVE_COMPILER_COMPLETION.md'
      - 'MESH_STATE_WORKFLOW.md'
      - 'VRM_RUNTIME.md'
      - 'O5_FORMAT_IMPORTS.md'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild current upstream versions
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: newpage-upstream-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      tag: ${{ steps.sync.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify maintained source matches the overlay
        run: python3 .github/scripts/refresh_overlay.py --check
      - name: Discover versions, download references and apply compatibility patch
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ inputs.force || false }}
        shell: bash
        run: |
          args=()
          if [ "$FORCE_REBUILD" = "true" ]; then args+=(--force); fi
          python3 .github/scripts/upstream_release.py prepare --work sync-work "${args[@]}"
      - name: Archive exact merged source
        if: steps.sync.outputs.changed == 'true'
        run: python3 .github/scripts/upstream_release.py source-archive --source sync-work/candidate --output sync-work/NewPageMergeMDL-source.zip
      - uses: actions/upload-artifact@v7
        if: steps.sync.outputs.changed == 'true'
        with:
          name: merged-source
          path: |
            sync-work/NewPageMergeMDL-source.zip
            sync-work/upstream-manifest.json
            sync-work/release-notes.md
          if-no-files-found: error
          retention-days: 14

  build:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win64
            ext: .exe
          - os: ubuntu-latest
            platform: linux64
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: merged-source
          path: prepared
      - name: Extract source
        run: python -m zipfile -e prepared/NewPageMergeMDL-source.zip candidate
      - name: Configure
        run: cmake -S candidate/NewPageMergeMDL -B build -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DPULSE_BUILD_MESHTOOL=ON -DPULSE_BUILD_L4D_ANIMSWAP=ON -DPULSE_BUILD_VMD2VALVEBIPED=ON -DPULSE_BUILD_AG2PROPORTIONS=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${{ github.workspace }}/dist" -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_MINSIZEREL="${{ github.workspace }}/dist"
      - name: Build every tool
        run: cmake --build build --config MinSizeRel --parallel 2
      - name: Test pipeline helpers
        run: python -m unittest discover -s tests -p test_automation.py -v
      - name: Test pinned helper staging
        run: python -m unittest discover -s tests -p test_windows_extras.py -v
      - name: Stage verified Windows C4D helper
        if: matrix.platform == 'win64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/fetch_windows_extras.py --dist dist
      - name: Test emitted models and decompiled animations
        run: python candidate/NewPageMergeMDL/tests/compatibility.py dist/NewPageMergeMDL${{ matrix.ext }}
      - name: Package with source provenance
        run: python .github/scripts/upstream_release.py package --source candidate/NewPageMergeMDL --dist dist --platform ${{ matrix.platform }} --manifest prepared/upstream-manifest.json --source-archive prepared/NewPageMergeMDL-source.zip --output newpage-merge-mdl-${{ matrix.platform }}.zip
      - name: Verify packaged binaries before release
        run: python candidate/NewPageMergeMDL/tests/verify_package.py newpage-merge-mdl-${{ matrix.platform }}.zip --manifest prepared/upstream-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: tested-${{ matrix.platform }}
          path: newpage-merge-mdl-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: merged-source
          path: prepared
      - uses: actions/download-artifact@v8
        with:
          pattern: tested-*
          merge-multiple: true
          path: release-files
      - name: Add single-package installation and ZIP checksums to release notes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          notes = Path('prepared/release-notes.md')
          intro = ('Download one ZIP for your operating system and extract the entire folder. '
                   'Windows includes the C4D and VRML converters; Linux includes the tools supported on Linux. '
                   'Read INSTALL.md inside the package and always set -game to the directory containing '
                   'the correct target gameinfo.txt before compiling. No separate source, update or helper '
                   'download is needed: exact merged source, provenance, checksums and validation reports '
                   'are included in each package.\n\n'
                   '下载对应系统的一个 ZIP，完整解压即可使用；编译前务必设置正确的 gameinfo.txt 所在目录。'
                   '安装说明、源码、校验清单和验证记录均在包内。\n\n')
          checksums = '\n'.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}'
                                for p in sorted(Path('release-files').glob('newpage-merge-mdl-*.zip')))
          notes.write_text(intro + notes.read_text(encoding='utf-8') + '\n\nZIP SHA256:\n```text\n'
                           + checksums + '\n```\n', encoding='utf-8')
          PY
      - name: Publish complete tested release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          python3 .github/scripts/publish_release.py draft --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --target "$GITHUB_SHA" --notes-file prepared/release-notes.md
          gh release upload "$RELEASE_TAG" release-files/newpage-merge-mdl-win64.zip release-files/newpage-merge-mdl-linux64.zip --clobber
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, str(Path('.github/scripts').resolve()))
          from publish_release import find_release
          tag = os.environ['RELEASE_TAG']
          release = find_release(os.environ['GITHUB_REPOSITORY'], tag)
          keep = {'newpage-merge-mdl-win64.zip', 'newpage-merge-mdl-linux64.zip'}
          for name in keep:
              matches = [asset for asset in release['assets'] if asset['name'] == name]
              expected = 'sha256:' + hashlib.sha256((Path('release-files') / name).read_bytes()).hexdigest()
              if len(matches) != 1 or matches[0].get('digest') != expected:
                  raise RuntimeError('Uploaded package digest mismatch: ' + name)
          # A forced retry may target a release made by the older multi-asset flow.
          # Remove superseded assets only after both complete ZIPs are verified.
          for asset in release['assets']:
              if asset['name'] not in keep:
                  subprocess.run(['gh', 'release', 'delete-asset', tag, asset['name'], '--yes'], check=True)
          PY
          python3 .github/scripts/publish_release.py publish --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --notes-file prepared/release-notes.md
