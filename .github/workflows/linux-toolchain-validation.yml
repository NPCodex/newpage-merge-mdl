name: Linux toolchain validation

on:
  workflow_dispatch:
    inputs:
      include-gcc:
        description: Also validate GCC and retain standalone validation packages
        type: boolean
        default: true
      quality-checks:
        description: Run bounded ASan/UBSan mutations and two-clean-build comparisons
        type: boolean
        default: false
  workflow_call:
    inputs:
      include-gcc:
        description: Also validate GCC and retain standalone validation packages
        type: boolean
        default: false
      source-artifact:
        description: Optional artifact containing the exact merged source
        type: string
        default: ''
      quality-checks:
        description: Run bounded ASan/UBSan mutations and two-clean-build comparisons
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sanitizers:
    if: inputs.quality-checks
    uses: ./.github/workflows/sanitizer-mutations.yml
    with:
      source-artifact: ${{ inputs.source-artifact || '' }}
  reproducibility:
    if: inputs.quality-checks
    uses: ./.github/workflows/reproducible-builds.yml
    with:
      source-artifact: ${{ inputs.source-artifact || '' }}
  clang:
    strategy:
      fail-fast: false
      matrix:
        compiler: ${{ fromJSON(inputs.include-gcc && '["clang", "gcc"]' || '["clang"]') }}
    name: Linux ${{ matrix.compiler }} validation
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VALIDATION_CC: ${{ matrix.compiler == 'gcc' && 'gcc-13' || 'clang-18' }}
      VALIDATION_CXX: ${{ matrix.compiler == 'gcc' && 'g++-13' || 'clang++-18' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        if: inputs.source-artifact != ''
        with:
          name: ${{ inputs.source-artifact }}
          path: prepared
      - name: Select exact validation source
        shell: bash
        env:
          SOURCE_ARTIFACT: ${{ inputs.source-artifact }}
        run: |
          if [ -n "$SOURCE_ARTIFACT" ]; then
            python -m zipfile -e prepared/NewPageMergeMDL-source.zip candidate
            echo "VALIDATION_SOURCE=$GITHUB_WORKSPACE/candidate/NewPageMergeMDL" >> "$GITHUB_ENV"
          else
            mkdir -p prepared
            git -c core.autocrlf=false -c core.eol=lf archive --format=zip --prefix=NewPageMergeMDL/ --output=prepared/NewPageMergeMDL-source.zip HEAD
            echo "VALIDATION_SOURCE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi

      - name: Test Lua runtime metadata and math
        run: |
          python -m pip install lupa==2.6
          python -c "from lupa.lua51 import LuaRuntime; LuaRuntime()"
          python "$VALIDATION_SOURCE/tests/runtime_metadata_test.py"
          python "$VALIDATION_SOURCE/tests/vrm_runtime_lua_test.py"

      - name: Verify unavailable IPO falls back to ordinary linking
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/clang-no-lto" <<'SH'
          #!/bin/sh
          for argument in "$@"; do
            case "$argument" in
              -flto*)
                printf '%s\n' "$*" >> "$IPO_REJECTION_MARKER"
                echo 'IPO intentionally unavailable in validation probe' >&2
                exit 1
                ;;
            esac
          done
          exec clang++ "$@"
          SH
          chmod +x "$RUNNER_TEMP/clang-no-lto"
          export CC=clang CXX="$RUNNER_TEMP/clang-no-lto"
          export IPO_REJECTION_MARKER="$RUNNER_TEMP/ipo-rejection-marker"
          cmake -S "$VALIDATION_SOURCE" -B ipo-fallback -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
          python - <<'PY'
          import os
          from pathlib import Path
          cache = Path('ipo-fallback/CMakeCache.txt').read_text()
          marker = Path(os.environ['IPO_REJECTION_MARKER'])
          if not marker.is_file() or '-flto' not in marker.read_text() or '_CMakeLTOTest-CXX' not in marker.read_text():
              raise SystemExit('The IPO probe did not exercise the rejecting compiler')
          if 'CMAKE_INTERPROCEDURAL_OPTIMIZATION:BOOL=OFF' not in cache:
              raise SystemExit('Unavailable IPO did not disable LTO in CMakeCache')
          PY

      - name: Configure validation compiler without LTO
        run: cmake -S "$VALIDATION_SOURCE" -B clang-build -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_C_COMPILER="$VALIDATION_CC" -DCMAKE_CXX_COMPILER="$VALIDATION_CXX" -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF -DPULSE_BUILD_MESHTOOL=ON -DPULSE_BUILD_L4D_ANIMSWAP=ON -DPULSE_BUILD_VMD2VALVEBIPED=ON -DPULSE_BUILD_AG2PROPORTIONS=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${{ github.workspace }}/clang-dist"
      - name: Build all tools
        run: cmake --build clang-build --parallel 2
      - name: Build and run recovery and format tests
        run: |
          cmake -S "$VALIDATION_SOURCE/tests/output_transactions" -B clang-output-tests -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER="$VALIDATION_CC" -DCMAKE_CXX_COMPILER="$VALIDATION_CXX"
          cmake --build clang-output-tests --parallel 2
          ctest --test-dir clang-output-tests --output-on-failure
          cmake -S "$VALIDATION_SOURCE/tests/meshtool_response" -B clang-mesh-tests -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER="$VALIDATION_CXX"
          cmake --build clang-mesh-tests --parallel 2
          ctest --test-dir clang-mesh-tests --output-on-failure
          cmake -S "$VALIDATION_SOURCE/tests/subtool_formats" -B subtool-format-tests -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER="$VALIDATION_CXX"
          cmake --build subtool-format-tests --parallel 2
          ctest --test-dir subtool-format-tests --output-on-failure
      - name: Package and test actual validation binaries
        shell: bash
        run: |
          if [ ! -f prepared/upstream-manifest.json ]; then
            python .github/scripts/upstream_release.py maintained-manifest --source "$VALIDATION_SOURCE" --output prepared/upstream-manifest.json --tag validation-only
          fi
          python .github/scripts/upstream_release.py record-build --manifest prepared/upstream-manifest.json --cache clang-build/CMakeCache.txt --configuration MinSizeRel
          python .github/scripts/upstream_release.py package --source "$VALIDATION_SOURCE" --dist clang-dist --platform linux64 --manifest prepared/upstream-manifest.json --source-archive prepared/NewPageMergeMDL-source.zip --output clang-validation.zip
          python "$VALIDATION_SOURCE/tests/verify_package.py" clang-validation.zip --manifest prepared/upstream-manifest.json --subtool-probe clang-output-tests/bin/subtool_transaction_probe
          python "$VALIDATION_SOURCE/tests/linux_package_smoke.py" clang-validation.zip --require-baseline
      - uses: actions/upload-artifact@v7
        if: inputs.include-gcc
        with:
          name: linux-${{ matrix.compiler }}-validation
          path: clang-validation.zip
